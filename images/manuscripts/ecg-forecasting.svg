  <path d="M60 332H103Q114 314 126 332H145L152 346L166 288L179 356L190 332H209Q232 302 255 332H309L316 346L330 288L343 356L354 332H373Q396 302 419 332H473L480 346L494 288L507 356L518 332H537Q560 302 583 332H656" fill="none" stroke="#788ba6" stroke-width="4" stroke-dasharray="9 6" stroke-linejoin="round"/>
  <text x="42" y="429" font-family="Arial, sans-serif" font-size="18" fill="#526b79">Longitudinal morphology · Patient-specific modeling</text>
