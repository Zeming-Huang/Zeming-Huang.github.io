- id: nor-tl
  label: NOR-TL
  title: "Normal-Reference Temporal Learning with Decoupled Supervision for Paroxysmal AF Detection"
  authors_html: "<strong>Zeming Huang</strong>, Tao Wang, Chenhao Wu, Ning Liu, Yiquan Wang, Lei Wang, Gong Su, Zhipei Huang, and Fei Qin"
  status: "Submitted to ICASSP 2027"
  role: "First author"
  image: /images/manuscripts/nor-tl.png
  image_alt: "NOR-TL architecture showing normal-reference and AF-specific encoders, with weak labels for pooled detection and interval annotations for sample-wise AF prediction."
  summary: "Estimating how much of a long recording is AF and when - an AF-burden-style, time-wise read-out rather than a short fixed-window decision. NOR-TL combines normal-reference and AF-specific features with decoupled supervision: weak recording labels guide pooled detection, while sparse interval annotations supervise sample-wise prediction. Evaluated with time-point MCC and temporal AUROC on clinical-grade AFDB, LTAFDB and CPSC2021 recordings."
  links:
    - label: PDF
      url: /files/papers/nor-tl.pdf

- id: miraus
  label: MIRAUS
  title: "MRI-Informed Residual Adaptation for Single-Frame TRUS Prostate Boundary Measurement"
  authors_html: "<strong>Zeming Huang</strong>, Haixin Chen, Chuanzhen Cao, Tao Wang, Zhipei Huang, and Fei Qin"
  status: "In preparation for submission to Measurement"
  role: "Co-first author · listed first"
  image: /images/manuscripts/miraus.png
  image_alt: "MIRAUS Figure 2: MRI-privileged teacher training, residual privileged transfer, and TRUS-only deployment."
  summary: "Using MRI-derived anatomy during training to support prostate boundary measurement from a single ultrasound frame. The deployed model requires no MRI and supports both automatic and box-assisted inference."
  links:
    - label: PDF
      url: /files/papers/miraus.pdf
    - label: Code
      url: https://github.com/Zeming-Huang/MIRAUS
    - label: Project
      url: https://zeming-huang.github.io/MIRAUS/

- id: prism
  label: PRISM
  title: "A Privileged Representation-Informed Synergistic Model for Transrectal Ultrasound-Only Prostate Segmentation"
  authors_html: "<strong>Zeming Huang</strong>, Haixin Chen, Chuanzhen Cao, Tao Wang, Zhipei Huang, and Fei Qin"
  status: "IEEE BIBM 2026 · accepted"
  role: "Co-first author · listed first"
  image: /images/manuscripts/prism.png
  image_alt: "Clinical motivation for MRI-informed ultrasound learning, illustrated using Figure 1 from MIRAUS."
  image_note: "Clinical context · MIRAUS Fig. 1"
  summary: "Transferring MRI anatomical information into prompt-assisted ultrasound segmentation. Privileged attention, reliability-aware fusion, and distribution alignment address weak cross-modal correspondence while keeping inference ultrasound-only."
  links:
    - label: PDF
      url: /files/papers/prism.pdf
    - label: Code
      url: https://github.com/Zeming-Huang/PRISM

- id: ecg-forecasting
  label: ECG FORECASTING
  title: "Individualized ECG Waveform Forecasting Enables Testable Predictions of Longitudinal Morphology"
  authors_html: "Tao Wang, <strong>Zeming Huang</strong>, Yiquan Wang, Ning Liu, Zhicheng Hu, Lei Wang, Gong Su, Zhipei Huang, Ming Yin, and Fei Qin"
  status: Manuscript
  role: "Second author"
  image: /images/manuscripts/ecg-forecasting.png
  image_alt: "Figure 1 from the individualized ECG forecasting manuscript: population-based model development and a baseline-to-future clinical workflow."
