- id: clef
  label: LONGITUDINAL ECG
  title: "A Cross-Temporal Latent Evolution Framework for Year-Scale ECG Waveform Forecasting from Historical Records"
  authors_html: "Tao Wang, Zhicheng Hu, Gong Su, <strong>Zeming Huang</strong>, Zhipei Huang, Ming Yin, Chenhao Wu, Xiangao Meng, and Fei Qin"
